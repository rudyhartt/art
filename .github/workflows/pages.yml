name: Publish artist portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare public site
        run: |
          rm -rf _site
          mkdir -p _site
          cp holding/index.html _site/index.html
          cp holding/index.html _site/about.html
          cp holding/index.html _site/404.html
          touch _site/.nojekyll
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4

